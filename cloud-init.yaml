#cloud-config
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - git

runcmd:
  - [systemctl, enable, --now, docker]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, 22/tcp]
  - [ufw, allow, 80/tcp]
  - [ufw, allow, 443/tcp]
  - [ufw, allow, 443/udp]
  - [ufw, --force, enable]
  - [install, -d, -m, '0750', /opt/linkops]
